# 2026-11-17 由 */10 改 */15：KV 免费版写入上限 1,000/天，*/10 时约 1,050/天超线；*/15 约 700/天
[triggers]
crons = ["*/15 * * * *"]

# KV：快照 / K 线 / Lighter 名单 / 状态机（namespace 已创建，2026-11-12）
[[kv_namespaces]]
